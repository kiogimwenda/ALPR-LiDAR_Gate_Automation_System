# gate-ota.conf — static OTA file server (ADR-009).
#
# Serves /srv/gate/firmware — manifest.json + signed images — on the
# field LAN. Two server blocks: plain http on 8081 (integrity still
# holds — the manifest SHA-256 + ed25519 signature protect the image,
# not the transport) and, once the site PKI exists, https on 8444 for
# the Phase 4.10.3 firmware (esp_https_ota pins ca.pem).
#
# Install: copy to /etc/nginx/sites-available/gate-ota, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`.

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /srv/gate;

    # Only the firmware directory exists under this server — nothing
    # to index, nothing to guess.
    autoindex off;

    location /firmware/ {
        types {
            application/json         json;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
        # Manifests must never be cached stale: a gate polls this file
        # to learn an update exists.
        location ~ manifest\.json$ {
            add_header Cache-Control "no-cache";
        }
    }

    location / {
        return 404;
    }
}

# TLS mirror of the same tree (Phase 4.10.1 host PKI; consumed by the
# Phase 4.10.3 firmware OTA client, which verifies against ca.pem).

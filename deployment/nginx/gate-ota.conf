# gate-ota.conf — static OTA file server (ADR-009).
#
# Serves /srv/gate/firmware — manifest.json + signed images — on the
# field LAN. Plain http today (the firmware's CONFIG_ESP_HTTPS_OTA_ALLOW_HTTP
# note applies: integrity comes from the manifest SHA-256 + ed25519
# signature, not the transport); the TLS server block joins in the
# Phase 4.10 hardening pass.
#
# Install: copy to /etc/nginx/sites-available/gate-ota, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`.

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /srv/gate;

    # Only the firmware directory exists under this server — nothing
    # to index, nothing to guess.
    autoindex off;

    location /firmware/ {
        types {
            application/json         json;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
        # Manifests must never be cached stale: a gate polls this file
        # to learn an update exists.
        location ~ manifest\.json$ {
            add_header Cache-Control "no-cache";
        }
    }

    location / {
        return 404;
    }
}

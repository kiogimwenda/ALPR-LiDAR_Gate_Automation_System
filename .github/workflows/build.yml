name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: debug-cpu }
          - { compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: release-cpu }
          - { compiler: clang-18, cc: clang-18, cxx: clang++-18, preset: debug-cpu }

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config autoconf automake \
            libtool bison flex python3 openssl ${{ matrix.compiler == 'gcc-14' && 'gcc-14 g++-14' || 'clang-18' }}

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.compiler }}

      - name: Configure (${{ matrix.preset }})
        # A configure without the vcpkg packages "succeeds" while skipping
        # server/, dashboard/, simulation/ and tests/ — which is how CI
        # used to pass while building nothing. A tree skipped for a missing
        # package fails here (server/inference skips by design: no GPU).
        run: |
          # Parallel debug-info links of the gRPC binaries can exhaust a
          # hosted runner's memory (the runner is shut down mid-build).
          cmake --preset ${{ matrix.preset }} -DGATE_LINK_JOBS=2 2>&1 | tee configure.log
          if grep -qE "Skipping [^ ]+: .*not found" configure.log; then
            echo "::error::a C++ tree was skipped at configure time"; exit 1
          fi

      - name: Save vcpkg binary cache
        # Right after configure (which runs vcpkg install) and even when
        # it failed, so packages that did build are kept for the next run.
        if: always() && env.VCPKG_CACHE_KEY != '' && env.VCPKG_CACHE_HIT != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: |
          n=$(ctest --test-dir build/${{ matrix.preset }} -N | sed -n 's/^Total Tests: //p')
          echo "registered tests: ${n}"
          [ "${n:-0}" -ge 200 ] || { echo "expected the full suite (>= 200 tests)" >&2; exit 1; }
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j "$(nproc)"

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config autoconf automake \
            libtool bison flex python3 openssl gcc-14 g++-14

      # Dependencies build without sanitizers (same cache as the gcc-14
      # build job); only this repo's code is instrumented.
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: gcc-14

      - name: Configure (${{ matrix.sanitizer }})
        run: |
          cmake --preset ${{ matrix.sanitizer }} 2>&1 | tee configure.log
          if grep -q "Skipping " configure.log; then
            echo "::error::a C++ tree was skipped at configure time"; exit 1
          fi

      - name: Build
        run: cmake --build build/${{ matrix.sanitizer }} --parallel

      - name: Test
        env:
          # gRPC keeps process-lifetime singletons; leak checking would
          # flag them on every test binary.
          ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          n=$(ctest --test-dir build/${{ matrix.sanitizer }} -N | sed -n 's/^Total Tests: //p')
          [ "${n:-0}" -ge 190 ] || { echo "expected the full suite (>= 190 tests), got ${n}" >&2; exit 1; }
          # Deps are not instrumented: container-overflow / use-after-poison
          # reports from grpc/protobuf internals are mismatch noise, and the
          # multi-process e2e passes time out under sanitizer slowdown.
          ctest --test-dir build/${{ matrix.sanitizer }} --output-on-failure -j "$(nproc)" -E "^e2e_"

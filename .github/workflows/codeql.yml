name: CodeQL

# Code scanning requires GitHub Advanced Security on private repos.
# This repo is private and GHAS is not enabled, so the automatic triggers
# (push / pull_request / schedule) would upload SARIF and fail with
# "Code scanning is not enabled for this repository". The workflow stays
# in the tree because (a) it still runs locally / on demand via
# `gh workflow run CodeQL`, and (b) the moment the repo flips public,
# code scanning is free and we just uncomment the block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 pkg-config \
            libsqlite3-dev

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DENABLE_GPU=OFF 2>/dev/null && \
          cmake --build build --parallel || \
          echo "Build not yet configured — CodeQL will analyze available source."

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

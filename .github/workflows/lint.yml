name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          # gate_rpc/src/pb is nanopb generator output (committed, see
          # scripts/gen-nanopb.sh) — machine-formatted, not ours to style.
          find server/ firmware/ shared/ dashboard/backend/ simulation/ \
            -path firmware/components/gate_rpc/src/pb -prune -o \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cu' \) -print \
            2>/dev/null | head -500 | \
          xargs -r clang-format --dry-run --Werror 2>&1 || {
            echo "::error::Code formatting issues found. Run: clang-format -i <files>"
            exit 1
          }
          echo "All files formatted correctly (or no source files found yet)."

  clang-tidy:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-tidy-18 cmake ninja-build pkg-config autoconf \
            automake libtool bison flex python3 gcc-14 g++-14

      # Same packages as the Build job (and its cache): without them the
      # configure skips every C++ tree, compile_commands.json is empty
      # and the job used to pass having checked nothing.
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: gcc-14

      - name: Configure + generate the proto headers
        run: |
          cmake --preset debug-cpu 2>&1 | tee configure.log
          if grep -qE "Skipping [^ ]+: .*not found" configure.log; then
            echo "::error::a C++ tree was skipped at configure time"; exit 1
          fi
          cmake --build build/debug-cpu --target gate_proto

      - name: Save vcpkg binary cache
        # Right after configure (which runs vcpkg install) and even when
        # it failed, so packages that did build are kept for the next run.
        if: always() && env.VCPKG_CACHE_KEY != '' && env.VCPKG_CACHE_HIT != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Run clang-tidy
        # Checks and naming rules: .clang-tidy (warnings are errors).
        # firmware/ targets ESP-IDF (xtensa), not this host database;
        # clang-format and the firmware workflow cover it.
        run: |
          n=$(jq '[.[] | select(.file | test("/(server|simulation|dashboard/backend|shared)/"))] | length' \
                build/debug-cpu/compile_commands.json)
          echo "translation units: ${n}"
          [ "${n:-0}" -ge 30 ] || { echo "::error::compile database is missing the C++ trees"; exit 1; }
          run-clang-tidy-18 -p build/debug-cpu -j "$(nproc)" -quiet \
            -clang-tidy-binary clang-tidy-18 \
            "$PWD/(server|simulation|dashboard/backend|shared)/"

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          SRC_DIRS=""
          for d in server/src firmware/src shared/include dashboard/backend/src simulation/src; do
            [ -d "$d" ] && SRC_DIRS="$SRC_DIRS $d"
          done
          if [ -n "$SRC_DIRS" ]; then
            # normalCheckLevelMaxBranches is an informational notice
            # ("analysis depth limited"), not a finding — but newer
            # cppcheck releases count it against --error-exitcode.
            cppcheck --enable=warning,performance,portability \
              --error-exitcode=1 --inline-suppr \
              --suppress=missingInclude \
              --suppress=normalCheckLevelMaxBranches \
              $SRC_DIRS
          else
            echo "No source directories found yet — skipping cppcheck."
          fi

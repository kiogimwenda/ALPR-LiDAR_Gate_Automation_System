name: Dashboard

# Frontend-only pipeline: type-check + production build. The C++
# backend rides the existing Build/Test/Lint workflows; this one is
# path-filtered so JS churn doesn't burn firmware/server CI minutes
# (and vice versa).

on:
  push:
    branches: [main, develop]
    paths: ['dashboard/frontend/**']
  pull_request:
    branches: [main, develop]
    paths: ['dashboard/frontend/**']

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Production build
        run: npm run build
